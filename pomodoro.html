<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batcaverna — Focus & Telemetry</title>
<style>
  :root {
    --bg: #191919;
    --panel: #202020;
    --panel-dark: #161616;
    --border: #2f2f2f;
    --text-main: #e5e5e5;
    --text-muted: #8a8a8a;
    --accent: #eab308;
    --accent-hover: #ca8a04;
    --accent-dim: rgba(234, 179, 8, 0.12);
    --green: #22c55e;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  body {
    background-color: var(--bg);
    color: var(--text-main);
    padding: 8px;
    overflow-x: hidden;
  }
  .telemetry-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .title {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .mode-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid rgba(234, 179, 8, 0.3);
  }
  .timer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .timer-display {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .timer-display.break-mode { color: var(--green); }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  button, select {
    background: var(--bg);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    color: #111;
    font-weight: 700;
    border-color: var(--accent);
  }
  button.primary:hover { background: var(--accent-hover); }
  button.save-btn {
    border-color: rgba(34, 197, 94, 0.45);
    color: var(--green);
  }
  button.save-btn:hover {
    background: rgba(34, 197, 94, 0.12);
    border-color: var(--green);
  }
  .select-row {
    display: flex;
    gap: 6px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 8px;
  }
  .stat-val { font-size: 15px; font-weight: 700; color: var(--accent); }
  .stat-lbl { font-size: 9px; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: var(--text-muted);
    flex-wrap: wrap;
    gap: 6px;
  }
  .history-drawer {
    display: none;
    background: var(--panel-dark);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    max-height: 140px;
    overflow-y: auto;
  }
  .history-drawer.open { display: block; }
  .history-head {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-muted);
    padding-bottom: 5px;
    margin-bottom: 5px;
    border-bottom: 1px solid var(--border);
  }
  .log-list { list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; }
  .log-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #262626; padding-bottom: 2px; }
  .log-tag { color: var(--accent); }
</style>
</head>
<body>

<div class="telemetry-card">
  <div class="header-row">
    <span class="title">⏱ FOCUS & TELEMETRY</span>
    <span class="mode-badge" id="pomo-status">FOCUS // 45:00</span>
  </div>

  <div class="timer-row">
    <div class="timer-display" id="timer-display">45:00</div>
    <div class="controls">
      <button class="primary" id="btn-start" onclick="toggleTimer()">START</button>
      <button class="save-btn" onclick="savePartialSession()" title="Salva i minuti già trascorsi nello storico e azzera">SAVE</button>
      <button onclick="resetTimer()" title="Azzera senza salvare">RESET</button>
      <button onclick="switchPreset()" id="btn-preset">45/10</button>
    </div>
  </div>

  <div class="select-row">
    <select id="study-category" style="flex:1;">
      <option value="Università (Esami)">📚 Università (Esami)</option>
      <option value="Coursera (Codice/Neuro)">💻 Coursera (Codice/Neuro)</option>
      <option value="SimNIBS MedTech">🧠 SimNIBS MedTech</option>
      <option value="Lingue (EN B2 / FR A2)">🌍 Lingue (EN B2 / FR A2)</option>
    </select>
    <button onclick="logManualSession()" title="Aggiungi sessione fatta offline">+ Log</button>
  </div>

  <div class="stats-grid">
    <div class="stat-box"><div class="stat-val" id="stat-week">0.0h</div><div class="stat-lbl">Settimana</div></div>
    <div class="stat-box"><div class="stat-val" id="stat-month">0.0h</div><div class="stat-lbl">Mese</div></div>
    <div class="stat-box"><div class="stat-val" id="stat-est">0.0h</div><div class="stat-lbl">Stima Mese</div></div>
  </div>

  <div class="footer-row">
    <span id="session-count">0 sessioni</span>
    <div style="display:flex; gap:5px;">
      <button onclick="toggleHistory()">Storico</button>
      <button onclick="exportCSV()">CSV</button>
    </div>
  </div>

  <div class="history-drawer" id="history-drawer">
    <div class="history-head">
      <span>SESSIONI PRECEDENTI</span>
      <button onclick="clearLogs()" style="font-size:9px; padding:1px 5px; color:#ef4444;">Reset</button>
    </div>
    <ul class="log-list" id="log-list"></ul>
  </div>
</div>

<script>
  let presetIndex = 0;
  const presets = [{ name: '45/10', focus: 45, brk: 10 }, { name: '25/5', focus: 25, brk: 5 }];
  let isBreak = false;
  let secondsLeft = presets[0].focus * 60;
  let timerInterval = null;

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.35);
    } catch (e) {}
  }

  function updateTimerUI() {
    const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
    const s = (secondsLeft % 60).toString().padStart(2, '0');
    const disp = document.getElementById('timer-display');
    disp.textContent = `${m}:${s}`;
    disp.className = isBreak ? 'timer-display break-mode' : 'timer-display';
    const p = presets[presetIndex];
    document.getElementById('pomo-status').textContent = isBreak ? `BREAK // ${p.brk}:00` : `FOCUS // ${p.focus}:00`;
  }

  function toggleTimer() {
    const btn = document.getElementById('btn-start');
    if (timerInterval) {
      clearInterval(timerInterval); timerInterval = null; btn.textContent = 'START';
    } else {
      btn.textContent = 'PAUSE';
      timerInterval = setInterval(() => {
        if (secondsLeft > 0) { secondsLeft--; updateTimerUI(); }
        else {
          clearInterval(timerInterval); timerInterval = null; btn.textContent = 'START';
          playBeep();
          const p = presets[presetIndex];
          if (!isBreak) {
            saveSession(p.focus, document.getElementById('study-category').value);
            isBreak = true; secondsLeft = p.brk * 60;
          } else {
            isBreak = false; secondsLeft = p.focus * 60;
          }
          updateTimerUI();
        }
      }, 1000);
    }
  }

  // Salva i minuti effettivamente trascorsi quando interrompi prima della fine
  function savePartialSession() {
    if (isBreak) {
      resetTimer();
      return;
    }
    const p = presets[presetIndex];
    const totalSeconds = p.focus * 60;
    const elapsedSeconds = totalSeconds - secondsLeft;
    const elapsedMinutes = Math.round(elapsedSeconds / 60);

    if (elapsedMinutes < 1) {
      alert('Meno di 1 minuto trascorso: sessione troppo breve per essere salvata.');
      return;
    }

    saveSession(elapsedMinutes, document.getElementById('study-category').value);
    resetTimer();
  }

  function resetTimer() {
    clearInterval(timerInterval); timerInterval = null;
    document.getElementById('btn-start').textContent = 'START';
    isBreak = false; secondsLeft = presets[presetIndex].focus * 60;
    updateTimerUI();
  }

  function switchPreset() {
    presetIndex = (presetIndex + 1) % presets.length;
    document.getElementById('btn-preset').textContent = presets[presetIndex].name;
    resetTimer();
  }

  function getSessions() { return JSON.parse(localStorage.getItem('batcaverna_sessions') || '[]'); }

  function saveSession(minutes, category) {
    const s = getSessions();
    s.unshift({ date: new Date().toISOString(), minutes, category });
    localStorage.setItem('batcaverna_sessions', JSON.stringify(s));
    renderStats();
  }

  function logManualSession() {
    const p = presets[presetIndex];
    const m = parseInt(prompt('Minuti di studio da registrare:', p.focus), 10);
    if (!isNaN(m) && m > 0) saveSession(m, document.getElementById('study-category').value);
  }

  function renderStats() {
    const sessions = getSessions();
    const now = new Date();
    const day = now.getDay() === 0 ? 6 : now.getDay() - 1;
    const startWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day);
    startWeek.setHours(0,0,0,0);
    const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);

    let wMin = 0, mMin = 0;
    sessions.forEach(s => {
      const d = new Date(s.date);
      if (d >= startMonth) mMin += s.minutes;
      if (d >= startWeek) wMin += s.minutes;
    });

    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const estMonth = ((mMin / 60) / Math.max(1, now.getDate()) * daysInMonth).toFixed(1);

    document.getElementById('stat-week').textContent = (wMin / 60).toFixed(1) + 'h';
    document.getElementById('stat-month').textContent = (mMin / 60).toFixed(1) + 'h';
    document.getElementById('stat-est').textContent = estMonth + 'h';
    document.getElementById('session-count').textContent = `${sessions.length} sessioni`;

    const list = document.getElementById('log-list');
    list.innerHTML = sessions.length ? '' : '<li style="color:var(--text-muted);">Nessuna sessione registrata.</li>';
    sessions.slice(0, 30).forEach(s => {
      const d = new Date(s.date);
      const ds = d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
      const li = document.createElement('li');
      li.className = 'log-item';
      li.innerHTML = `<span>${ds} <span class="log-tag">${s.category}</span></span><span><strong>${s.minutes}m</strong></span>`;
      list.appendChild(li);
    });
  }

  function toggleHistory() { document.getElementById('history-drawer').classList.toggle('open'); }
  function clearLogs() { if (confirm('Azzerare lo storico?')) { localStorage.removeItem('batcaverna_sessions'); renderStats(); } }
  function exportCSV() {
    const s = getSessions();
    if (!s.length) return alert('Nessun dato.');
    let csv = 'Data,Categoria,Minuti\n' + s.map(x => `"${x.date}","${x.category}",${x.minutes}`).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = `study_log_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  renderStats();
</script>
</body>
</html>
